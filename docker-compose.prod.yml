version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jinntell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jinntell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jinntell}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant (vector DB for RAG) ────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-jinntell}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jinntell}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./storage:/app/storage
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-jinntell}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jinntell}"
      DATABASE_URL_SYNC: "postgresql://${POSTGRES_USER:-jinntell}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jinntell}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-jinntell}@redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-jina}"
      JINA_API_KEY: "${JINA_API_KEY:-}"
      SECRET_KEY: "${SECRET_KEY}"
      DEBUG: "${DEBUG:-true}"
      # TURN (coturn)
      TURN_SECRET: "${TURN_SECRET:-}"
      TURN_REALM: "${TURN_REALM:-jinntell.ru}"
      TURN_HOST: "${TURN_HOST:-jinntell.ru}"
      TURN_PUBLIC_IP: "${TURN_PUBLIC_IP:-194.67.101.9}"
      # LLM
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEFAULT_LLM_PROVIDER: "${DEFAULT_LLM_PROVIDER:-openrouter}"
      # TTS / SpeechKit
      YANDEX_SPEECHKIT_API_KEY: "${YANDEX_SPEECHKIT_API_KEY:-}"
      YANDEX_SPEECHKIT_FOLDER_ID: "${YANDEX_SPEECHKIT_FOLDER_ID:-}"
      # Admin
      ADMIN_PHONES: '${ADMIN_PHONES:-["+79214787478"]}'
      # CORS — домен
      CORS_ORIGINS: '["https://jinntell.com", "https://www.jinntell.com", "http://localhost:3090"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js Frontend ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Пустая строка = тот же домен (nginx проксирует /api/ и /ws/)
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx — reverse proxy + SSL ─────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3090:3080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  # ── coturn — TURN/STUN для звонков за NAT ────────
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/certs:/etc/coturn/certs:ro

  # ── Certbot — Let's Encrypt SSL ─────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Запускается вручную или по крону:
    # docker compose -f docker-compose.prod.yml run certbot certonly --webroot -w /var/www/certbot -d jinntell.ru -d www.jinntell.ru
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  redisdata:
  qdrant_data:
